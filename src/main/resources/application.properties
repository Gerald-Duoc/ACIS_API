spring.application.name=acis-api
server.port=8080

# ---------------------------------------------------------------------------
# Base de datos (la que ves en phpMyAdmin)
# Crea antes la base "acis" (ver crear_bd.sql). Las tablas las crea la API sola.
#
# - Si phpMyAdmin dice "Servidor: MariaDB" (XAMPP):  jdbc:mariadb://...
# - Si dice "Servidor: MySQL":                       jdbc:mysql://...
# Puedes cambiar los valores aquí o con variables de entorno DB_URL, DB_USER y DB_PASSWORD.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/acis}
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/acis}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" crea y actualiza las tablas automáticamente según las clases del modelo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fotos: se suben como multipart y se guardan en la base de datos
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
acis.foto.max-bytes=5242880

# Sesiones (login)
acis.sesion.horas=12

# Clima real (Open-Meteo: gratis, sin clave, uso no comercial)
acis.clima.url=https://api.open-meteo.com
acis.clima.zona-horaria=America/Santiago
acis.clima.umbral-lluvia-mm=1.0
acis.clima.umbral-viento-kmh=40

# Carga los datos de ejemplo (clientes, equipos, técnicos y OT) si la base está vacía
acis.datos-iniciales=true
